<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up - TeLingua</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
<nav class="bg-[#0F2D5B] p-4">
<div class="flex justify-between items-center">
<a href="project1.html" class="text-white text-xl font-bold">🌍 TeLingua</a>
<div class="flex gap-6">
<a href="index.html" class="text-white">Home</a>
<a href="about.html" class="text-white">About</a>
<a href="contact.html" class="text-white">Contact</a>
<a href="signin.html" class="text-white">Sign In</a>
<a href="signup.html" class="text-white">Sign Up</a>
</div>
</div>
</nav>
<section class="bg-blue-50 text-center py-10">
<h1 class="text-4xl font-bold text-gray-900">Create Your TeLingua Account</h1>
<p class="mt-3 text-gray-600">Start your language-learning journey today.</p>
</section>
<section class="py-10 px-6">
<div class="max-w-lg mx-auto bg-white shadow-md rounded-lg p-8">
<h2 class="text-2xl font-bold text-gray-900 text-center">Sign Up</h2>
<p class="text-gray-600 text-center mt-2">Create your account to start learning.</p>
<form class="mt-6 space-y-5">
<div>
<label for="name" class="block mb-2 text-sm font-medium text-gray-900">Full Name</label>
<input type="text" id="name" name="name" placeholder="Enter your full name" required minlength="2" class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-teal-500 focus:border-teal-500">
</div>
<div>
<label for="email" class="block mb-2 text-sm font-medium text-gray-900">Email Address</label>
<input type="email" id="email" name="email" placeholder="name@example.com" required class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-teal-500 focus:border-teal-500">
</div>
<div>
<label for="language" class="block mb-2 text-sm font-medium text-gray-900">Choose a Language</label>
<select id="language" name="language" required class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-teal-500 focus:border-teal-500">
<option value="">Select a language</option>
<option value="French">French</option>
<option value="Spanish">Spanish</option>
<option value="German">German</option>
<option value="Italian">Italian</option>
</select>
</div>
<div>
<label for="password" class="block mb-2 text-sm font-medium text-gray-900">Password</label>
<input type="password" id="password" name="password" placeholder="Create a password" required minlength="8" class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-teal-500 focus:border-teal-500">
</div>
<div>
<label for="confirm-password" class="block mb-2 text-sm font-medium text-gray-900">Confirm Password</label>
<input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm your password" required minlength="8" class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-teal-500 focus:border-teal-500">
</div>
<div class="flex items-center">
<input id="terms" type="checkbox" required class="w-4 h-4 text-teal-600 border-gray-300 rounded">
<label for="terms" class="ml-2 text-sm text-gray-600">I agree to the terms and conditions.</label>
</div>
<button type="submit" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-medium rounded-lg px-5 py-2.5">Create Account</button>
</form>
<p class="text-center text-sm text-gray-600 mt-6">Already have an account? <a href="signin.html" class="text-teal-600 font-semibold hover:underline">Sign in.</a></p>
</div>
</section>
<footer class="bg-[#0F2D5B] text-white text-center p-6">
<p>© 2026 TeLingua. All rights reserved.</p>
<div class="mt-2">
<a href="project1.html" class="mx-2">Home</a>
<a href="about.html" class="mx-2">About</a>
<a href="contact.html" class="mx-2">Contact</a>
</div>
</footer>
</body>
</html>
